[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "angular-conditional-distillation"
version = "0.1.0"
description = "Angular Coordinate Interface and Scale-Invariant Conditional Distillation"
requires-python = ">=3.11"
dependencies = ["torch>=2.1", "torchvision>=0.16", "numpy>=1.24", "Pillow>=9"]

[project.optional-dependencies]
figures = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["acd*"]

[tool.setuptools.package-data]
"acd.models" = ["registry.json"]
