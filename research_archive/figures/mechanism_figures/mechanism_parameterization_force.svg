<text x="643" y="252.6" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="end" fill="#627381">0.2</text>
<text x="655" y="196" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#627381">mean non-target total variation</text>
