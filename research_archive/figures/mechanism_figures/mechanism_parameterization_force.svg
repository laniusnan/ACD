<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="690" viewBox="0 0 2000 690" role="img">
<title>Parameterization changes both probability weights and KD force</title><desc>Read-only checkpoint probe  /  VGG13 → MobileNetV1  /  linear KD seed 2102  /  128 fixed official-test images</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#627381"/></marker></defs>
<rect width="2000" height="100%" fill="white"/>
<text x="45" y="45" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#172B3A">Parameterization changes both probability weights and KD force</text>
<text x="45" y="75" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#627381">Read-only checkpoint probe  /  VGG13 → MobileNetV1  /  linear KD seed 2102  /  128 fixed official-test images</text>
<text x="45" y="124" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#172B3A">(a) Exact mechanism</text>
<rect x="45" y="148" width="485" height="273" rx="8" fill="#F5F7F9" stroke="none"/>
<text x="70" y="188" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#172B3A">zₖ = r aₖ cos θₖ + bₖ</text>
<text x="70" y="227" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#172B3A">pₖ = softmax(z/T)ₖ</text>
<text x="70" y="260" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#172B3A">∇ₕ LKD = T Σₖ (pₖ − qₖ) aₖuₖ</text>
<rect x="70" y="286" width="186" height="91" rx="8" fill="#FFF5E9" stroke="none"/>
<rect x="274" y="286" width="220" height="91" rx="8" fill="#F3EEF8" stroke="none"/>
<text x="163" y="319" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#D88A2D">Scale / norms</text>
<text x="163" y="350" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#172B3A">r, aₖ change pₖ</text>
<text x="384" y="319" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#8B71AB">Bias</text>
<text x="384" y="350" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#172B3A">bₖ changes pₖ</text>
<text x="70" y="403" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#627381">aₖ also rescales each gradient basis vector uₖ.</text>
<text x="620" y="124" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#172B3A">(b) Fixed directions → output deformation</text>
<text x="620" y="151" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#627381">Hold ĥ and ŵₖ fixed; continuously inject r·aₖ and bₖ.</text>
<line x1="655" y1="211" x2="655" y2="389" stroke="#DCE3E8" stroke-width="1.5"/>
<line x1="655" y1="389" x2="1085" y2="389" stroke="#DCE3E8" stroke-width="1.5"/>
