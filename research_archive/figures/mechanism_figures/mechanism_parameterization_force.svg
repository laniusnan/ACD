<text x="750" y="248.69489789009094" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#D88A2D">0.182</text>
<text x="750" y="416" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#627381">angular → scale</text>
