<text x="1601" y="417" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#627381">raw</text>
<text x="1285" y="444" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#B94D58">Raw force norm / reference = 14.7×</text>
<line x1="45" y1="579" x2="1955" y2="579" stroke="#DCE3E8" stroke-width="1.5"/>
<text x="45" y="599" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#627381">Mathematical claim: scale/norms and bias enter pₖ; class norms also enter the gradient basis. No claim that they rotate θₖ.</text>
<text x="45" y="622" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#627381">Measured: this checkpoint probe shows substantial scale-driven conditional-distribution deformation; its bias contribution is small here.</text>
<text x="45" y="645" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#627381">The standardized-logit gradient is a diagnostic reference, not semantic ground truth or proof of globally conflicting optimization.</text>
</svg>
