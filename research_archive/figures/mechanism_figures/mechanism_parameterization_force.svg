<text x="890" y="416" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#627381">scale → raw bias</text>
<rect x="1005" y="259.5998992919922" width="50" height="129.4001007080078" rx="3" fill="#B94D58" stroke="none"/>
<text x="1030" y="248.5998992919922" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#B94D58">0.182</text>
<text x="1030" y="416" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#627381">angular → raw</text>
<text x="1250" y="124" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#172B3A">(c) Raw force differs in direction and norm</text>
<text x="1250" y="151" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#627381">Cosine to standardized-logit reference; mean over 128 images.</text>
