<text x="1427" y="417" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#627381">scale</text>
<rect x="1495" y="289.0086706876755" width="38" height="99.99132931232452" rx="2" fill="#8B71AB" stroke="none"/>
<text x="1514" y="279.0086706876755" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#8B71AB">0.45</text>
<text x="1514" y="417" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#627381">bias</text>
<rect x="1582" y="263.71108987927437" width="38" height="125.28891012072563" rx="2" fill="#B94D58" stroke="none"/>
